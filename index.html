    <meta
      name="description"
      content="Aplikasi belajar 500 kosakata kanji JLPT N4 dan seri buku JF Irodori dengan flashcard interaktif, daftar pencarian, pelafalan audio Jepang, kuis pilihan ganda 5 model, serta sinkronisasi progres."
    />
    <meta property="og:title" content="N4 Kanji - Flashcard &amp; Kuis Pilihan Ganda" />

      property="og:description"
      content="Aplikasi belajar 500 kosakata kanji JLPT N4 dan seri buku JF Irodori dengan flashcard interaktif, daftar pencarian, pelafalan audio Jepang, kuis pilihan ganda 5 model, serta sinkronisasi progres."

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('n4kanji_theme_v1');
          var isDark =
            saved === 'dark' ||
            (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-indigo-100 selection:text-indigo-900 dark:selection:bg-indigo-900 dark:selection:text-indigo-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
